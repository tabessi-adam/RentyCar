<section class="contact-section">
  <div class="container">
    <h2 class="section-title">Contact Us</h2>
    
    <div class="contact-content">
      <div class="contact-info">
        <div class="info-item">
          <fa-icon [icon]="faMapMarkerAlt" class="icon"></fa-icon>
          <div class="text">
            <h3>Location</h3>
            <p>123 Business Street, City, Country</p>
          </div>
        </div>
        
        <div class="info-item">
          <fa-icon [icon]="faPhone" class="icon"></fa-icon>
          <div class="text">
            <h3>Phone</h3>
            <p>+1 (123) 456-7890</p>
          </div>
        </div>
        
        <div class="info-item">
          <fa-icon [icon]="faEnvelope" class="icon"></fa-icon>
          <div class="text">
            <h3>Email</h3>
            <p>info[at]yourcompany.com</p>
          </div>
        </div>
      </div>

      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
        <div class="form-group">
          <input type="text" formControlName="name" placeholder="Your Name" class="form-control">
          <div class="error-message" *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
            Name is required
          </div>
        </div>

        <div class="form-group">
          <input type="email" formControlName="email" placeholder="Your Email" class="form-control">
          <div class="error-message" *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
            Please enter a valid email
          </div>
        </div>

        <div class="form-group">
          <input type="text" formControlName="subject" placeholder="Subject" class="form-control">
          <div class="error-message" *ngIf="contactForm.get('subject')?.invalid && contactForm.get('subject')?.touched">
            Subject is required
          </div>
        </div>

        <div class="form-group">
          <textarea formControlName="message" placeholder="Your Message" class="form-control" rows="5"></textarea>
          <div class="error-message" *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched">
            Message must be at least 10 characters
          </div>
        </div>

        <button type="submit" class="btn btn--primary" [disabled]="contactForm.invalid">
          Send Message
        </button>
      </form>
    </div>
  </div>
</section>
