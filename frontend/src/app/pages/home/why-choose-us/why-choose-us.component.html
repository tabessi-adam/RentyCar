<section class="why-choose-us">
  <div class="container">
    <h2 class="section-title">Why Choose Us</h2>
    
    <div class="content-wrapper">
      <div class="description">
        <p>At Auto rent, we understand that choosing the right car rental service is important. Here's why we stand out from the rest and why we're the perfect choice for your next journey:</p>
      </div>
      
      <div class="features-grid">
        <div class="feature-card" *ngFor="let feature of features">
          <div class="icon-wrapper">
            <fa-icon [icon]="feature.icon"></fa-icon>
          </div>
          <h3 class="feature-title">{{feature.title}}</h3>
        </div>
      </div>
    </div>
  </div>
</section>
