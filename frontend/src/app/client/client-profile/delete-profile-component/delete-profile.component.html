<div class="delete-profile-container">
  <h1 class="page-title">{{ 'DELETE_PROFILE.TITLE' | translate }}</h1>
  
  <div class="warning-card">
    <div class="warning-message">
      {{ 'DELETE_PROFILE.WARNING' | translate }}
    </div>
    
    <button class="delete-button" (click)="openConfirmation()">
      {{ 'DELETE_PROFILE.DELETE_ACCOUNT' | translate }}
    </button>
  </div>
  
  @if (showConfirmation) {
    <div class="confirmation-dialog">
      <div class="confirmation-content">
        <h2>{{ 'DELETE_PROFILE.CONFIRMATION_TITLE' | translate }}</h2>
        <p>{{ 'DELETE_PROFILE.CONFIRMATION_MESSAGE' | translate }}</p>
        
        @if (error) {
          <div class="error-message">{{ 'DELETE_PROFILE.ERROR' | translate }}</div>
        }
        
        <div class="confirmation-buttons">
          <button class="cancel-button" (click)="closeConfirmation()">{{ 'DELETE_PROFILE.CANCEL' | translate }}</button>
          <button 
            class="confirm-delete-button" 
            (click)="confirmDelete()"
            [disabled]="isDeleting">
            @if (isDeleting) {
              {{ 'DELETE_PROFILE.DELETING' | translate }}
            } @else {
              {{ 'DELETE_PROFILE.CONFIRM_DELETE' | translate }}
            }
          </button>
        </div>
      </div>
    </div>
  }
</div>
