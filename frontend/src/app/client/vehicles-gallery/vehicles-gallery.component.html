<app-navbar></app-navbar>
<main class="vehicles-gallery">
  <aside class="filters-section">
    <app-vehicles-filter (filtersChanged)="onFiltersChanged($event)" (clearFilters)="onClearFilters()"></app-vehicles-filter>
  </aside>

  <section class="vehicles-section">
    <app-search-bar (search)="onSearch($event)" (clear)="onClearSearch()"></app-search-bar>
    
    @if (isLoading) {
      <div class="vehicles-grid">
        @for (item of [1,2,3,4,5,6]; track item) {
          <div class="vehicle-skeleton">
            <div class="skeleton-image"></div>
            <div class="skeleton-content">
              <div class="skeleton-title"></div>
              <div class="skeleton-details">
                <div class="skeleton-detail"></div>
                <div class="skeleton-detail"></div>
                <div class="skeleton-detail"></div>
              </div>
              <div class="skeleton-price"></div>
            </div>
          </div>
        }
      </div>
    } @else if (error) {
      <div class="error-message">
        <p>{{ error }}</p>
      </div>
    } @else if (vehicles.length === 0) {
      <div class="no-vehicles-message">
        <p>No vehicles found matching your filters.</p>
      </div>
    } @else {
      <div class="vehicles-grid">
        @for (vehicle of vehicles; track vehicle.id) {
          <app-vehicle-card [vehicle]="vehicle"></app-vehicle-card>
        }
      </div>
    }
  </section>
</main>
<app-footer></app-footer>
