<div class="vehicle-card">
  <div class="image-container">
    <img *ngIf="vehicle.images?.[0]?.url || vehicle.imageUrl" 
         [src]="vehicle.images?.[0]?.url || vehicle.imageUrl" 
         [alt]="vehicle.brand + ' ' + vehicle.model">
    <div *ngIf="!vehicle.images?.[0]?.url && !vehicle.imageUrl" class="no-image-placeholder">
      <i class="fas fa-car fa-4x"></i>
      <span>No Image Available</span>
    </div>
  </div>

  <div class="info-box">
    <div class="vehicle-title">
      <h3>{{ vehicle.brand }} {{ vehicle.model }}</h3>
    </div>

    <div class="features-and-footer">
      <div class="features-grid">
        <div class="feature-badge">
          <i class="fas fa-road"></i>
          <span>{{ vehicle.kilometersDriven | number }} miles</span>
        </div>
        <div class="feature-badge">
          <i class="fas fa-cogs"></i>
          <span>{{ vehicle.transmission }}</span>
        </div>
        <div class="feature-badge">
          <i class="fas fa-gas-pump"></i>
          <span>{{ vehicle.fuelType }}</span>
        </div>
        <div class="feature-badge">
          <i class="fas fa-palette"></i>
          <span>{{ vehicle.color }}</span>
        </div>
      </div>

      <div class="card-footer">
        <div class="price">
          <span class="price-value">{{ vehicle.pricePerDay }} TND</span>
          <span class="price-unit">/ Day</span>
        </div>
        <button class="book-now" [disabled]="vehicle.currentStatus !== 'AVAILABLE'">
          Book Now
        </button>
      </div>
    </div>
  </div>
</div>
