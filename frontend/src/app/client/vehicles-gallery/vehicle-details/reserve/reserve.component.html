<mat-card class="reserve-card">
  <mat-card-content>
    <app-calendar
      [selectedStartDate]="selectedStartDate"
      [selectedEndDate]="selectedEndDate"
      [bookedDates]="rentedDates"
      (dateRangeChange)="onDateRangeChange($event)"
    ></app-calendar>

    <div class="calendar-legend">
      <div class="legend-item">
        <div class="color-box selected"></div>
        <span>Selected Dates</span>
      </div>
      <div class="legend-item">
        <div class="color-box pending"></div>
        <span>Your Pending Requests</span>
      </div>
      <div class="legend-item">
        <div class="color-box accepted"></div>
        <span>Your Accepted Requests</span>
      </div>
      <div class="legend-item">
        <div class="color-box other-client"></div>
        <span>Reserved Days</span>
      </div>
    </div>

    <div class="price-summary" *ngIf="selectedStartDate && selectedEndDate">
      <div class="price-row">
        <span>Price per day</span>
        <span>{{ vehicle.pricePerDay }} TND</span>
      </div>
      <div class="price-row">
        <span>Number of days</span>
        <span>{{ calculateTotalDays() }}</span>
      </div>
      <div class="price-row total">
        <span>Total Price</span>
        <span>{{ calculateTotalPrice() }} TND</span>
      </div>
      <div class="price-row damage-deposit">
        <span>Damage Deposit (2x Total Price)</span>
        <span>{{ calculateTotalPrice() * 2 }} TND</span>
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button 
            class="reserve-button"
            [disabled]="!selectedStartDate || !selectedEndDate || isReserving"
            (click)="reserveVehicle()">
      {{ isReserving ? 'Reserving...' : 'Reserve Now' }}
    </button>
  </mat-card-actions>
</mat-card>
