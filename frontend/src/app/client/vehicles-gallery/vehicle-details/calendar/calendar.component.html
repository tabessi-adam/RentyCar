<div class="calendar-container">
  <div class="calendar-header">
    <h3>Select Dates</h3>
    <div class="selected-dates" *ngIf="selectedStartDate || selectedEndDate">
      <span *ngIf="selectedStartDate">From: {{ selectedStartDate | date:'mediumDate' }}</span>
      <span *ngIf="selectedEndDate">To: {{ selectedEndDate | date:'mediumDate' }}</span>
    </div>
  </div>

  <div class="calendar">
    <div class="calendar-controls">
      <button (click)="previousMonth()">&lt;</button>
      <span class="month-year">{{ currentMonth | date:'MMMM yyyy' }}</span>
      <button (click)="nextMonth()">&gt;</button>
    </div>
    
    <div class="weekdays">
      <div *ngFor="let day of weekDays">{{ day }}</div>
    </div>
    
    <div class="days">
      <div *ngFor="let day of calendarDays" 
           [class]="getDayClass(day)"
           (click)="onDayClick(day)">
        {{ day?.getDate() }}
      </div>
    </div>
  </div>
</div>
