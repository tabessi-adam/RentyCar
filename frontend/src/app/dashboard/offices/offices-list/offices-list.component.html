<div class="container">
  <div class="table-container">
   
    <table mat-table [dataSource]="offices">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let office">{{office.id}}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let office">{{office.name}}</td>
      </ng-container>

      <!-- Address Column -->
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Address</th>
        <td mat-cell *matCellDef="let office">{{office.address}}</td>
      </ng-container>

      <!-- Phone Number Column -->
      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef>Phone Number</th>
        <td mat-cell *matCellDef="let office">{{office.phoneNumber || '-'}}</td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created At</th>
        <td mat-cell *matCellDef="let office">{{office.createdAt | date:'medium'}}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let office">
          <button class="action-button view" (click)="onView(office)" aria-label="View office details">
            <i class="fas fa-eye"></i>
          </button>
          <button class="action-button edit" (click)="onEdit(office)" aria-label="Edit office">
            <i class="fas fa-edit"></i>
          </button>
          <button class="action-button delete" (click)="onDelete(office)" aria-label="Delete office">
            <i class="fas fa-trash-alt"></i>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div class="loading-shade" *ngIf="isLoading">
      <mat-spinner></mat-spinner>
    </div>

    <div class="no-data" *ngIf="!isLoading && offices.length === 0">
      <p>No offices found</p>
    </div>
  </div>
</div>
