<h2 mat-dialog-title>Office Details</h2>
<mat-dialog-content>
  <div *ngIf="office">
    <p><strong>ID:</strong> {{office.id}}</p>
    <p><strong>Name:</strong> {{office.name}}</p>
    <p><strong>Address:</strong> {{office.address}}</p>
    <p><strong>Phone Number:</strong> {{office.phoneNumber || '-'}}</p>
    <p><strong>Created At:</strong> {{office.createdAt | date:'medium'}}</p>
    <p><strong>Last Updated:</strong> {{office.updatedAt | date:'medium'}}</p>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
