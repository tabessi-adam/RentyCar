<div class="add-office-dialog">
  <h2 mat-dialog-title>Add New Office</h2>
  
  <form [formGroup]="officeForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <div class="form-grid">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" placeholder="Enter office name">
          <mat-error *ngIf="officeForm.get('name')?.hasError('required')">
            Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Address</mat-label>
          <input matInput formControlName="address" placeholder="Enter office address">
          <mat-error *ngIf="officeForm.get('address')?.hasError('required')">
            Address is required
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Phone Number</mat-label>
          <input matInput formControlName="phoneNumber" placeholder="Enter phone number">
          <mat-error *ngIf="officeForm.get('phoneNumber')?.hasError('required')">
            Phone number is required
          </mat-error>
          <mat-error *ngIf="officeForm.get('phoneNumber')?.hasError('pattern')">
            Please enter a valid phone number
          </mat-error>
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="close()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!officeForm.valid || isLoading">
        <span *ngIf="!isLoading">Add Office</span>
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      </button>
    </mat-dialog-actions>
  </form>
</div>
