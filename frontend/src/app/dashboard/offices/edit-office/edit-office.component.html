<div class="edit-office-dialog">
  <h2 mat-dialog-title>Edit Office</h2>
  
  <form (ngSubmit)="onSubmit()" #officeForm="ngForm">
    <mat-dialog-content>
      <div class="form-grid">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput [(ngModel)]="office.name" name="name" required>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Address</mat-label>
          <input matInput [(ngModel)]="office.address" name="address" required>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Phone Number</mat-label>
          <input matInput [(ngModel)]="office.phoneNumber" name="phoneNumber" required>
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="close()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!officeForm.valid || isLoading">
        <span *ngIf="!isLoading">Update Office</span>
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      </button>
    </mat-dialog-actions>
  </form>
</div>
