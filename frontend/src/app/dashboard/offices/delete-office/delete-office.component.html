<div class="delete-dialog">
  <div class="dialog-header">
    <h2>Delete Office</h2>
    <button class="close-button" (click)="close()" aria-label="Close dialog">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div class="dialog-content">
    <p>Are you sure you want to delete the office "{{ data.office.name }}"?</p>
    <p class="warning">This action cannot be undone.</p>
  </div>

  <div class="dialog-actions">
    <button mat-button class="cancel-btn" (click)="close()">Cancel</button>
    <button mat-raised-button class="delete-btn" color="warn" (click)="onDelete()">Delete</button>
  </div>
</div>
