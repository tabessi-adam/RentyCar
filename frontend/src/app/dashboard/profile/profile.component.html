<div class="dashboard-container">
  <app-sidebar 
    [isExpanded]="isSidebarExpanded"
    (expandedChange)="onSidebarExpandedChange($event)">
  </app-sidebar>
  <main class="main-content" [class.sidebar-collapsed]="!isSidebarExpanded">
    <div class="profile-container">
      <div class="header-actions">
        <div class="management-dropdown">
          <button class="dropdown-trigger" (click)="toggleDropdown()">
            <h1>Profile Management</h1>
            <fa-icon [icon]="icons.chevronDown" class="dropdown-icon" [class.rotated]="isDropdownOpen"></fa-icon>
          </button>
          <div class="dropdown-menu" [class.show]="isDropdownOpen">
            <a routerLink="/admin/dashboard" class="dropdown-item" routerLinkActive="active">
              <fa-icon [icon]="icons.dashboard" class="item-icon"></fa-icon>
              Dashboard
            </a>
            <a routerLink="/admin/users" class="dropdown-item" routerLinkActive="active">
              <fa-icon [icon]="icons.users" class="item-icon"></fa-icon>
              Users Management
            </a>
            <a routerLink="/admin/offices" class="dropdown-item" routerLinkActive="active">
              <fa-icon [icon]="icons.offices" class="item-icon"></fa-icon>
              Offices Management
            </a>
            <a routerLink="/admin/vehicles" class="dropdown-item" routerLinkActive="active">
              <fa-icon [icon]="icons.vehicles" class="item-icon"></fa-icon>
              Vehicles Management
            </a>
            <a routerLink="/admin/reservations" class="dropdown-item" routerLinkActive="active">
              <fa-icon [icon]="icons.reservations" class="item-icon"></fa-icon>
              Reservations Management
            </a>
            <a routerLink="/admin/reviews" class="dropdown-item" routerLinkActive="active">
              <fa-icon [icon]="icons.reviews" class="item-icon"></fa-icon>
              Reviews Management
            </a>
            <a routerLink="/admin/profile" class="dropdown-item" routerLinkActive="active">
              <fa-icon [icon]="icons.profile" class="item-icon"></fa-icon>
              Profile Management
            </a>
          </div>
        </div>
      </div>
      <div class="profile-nav">
        <a [routerLink]="['view']" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{exact: true}"
           class="nav-link">
          <fa-icon [icon]="icons.user" class="nav-icon"></fa-icon>
          <span>View Profile</span>
        </a>
        <a [routerLink]="['edit']" 
           routerLinkActive="active"
           class="nav-link">
          <fa-icon [icon]="icons.edit" class="nav-icon"></fa-icon>
          <span>Edit Profile</span>
        </a>
        <a [routerLink]="['delete']" 
           routerLinkActive="active"
           class="nav-link">
          <fa-icon [icon]="icons.trash" class="nav-icon"></fa-icon>
          <span>Delete Profile</span>
        </a>
      </div>
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
