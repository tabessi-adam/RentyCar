<div class="profile-container">
  <div class="profile-card" *ngIf="profile">
    <div class="profile-header">
      <h2>Edit Profile</h2>
    </div>
    <div class="profile-content">
      <!-- Profile Picture Section -->
      <div class="profile-field profile-picture-section">
        <label>Profile Picture</label>
        <div class="profile-picture-container">
          @if (profile.profilePictureUrl) {
            <img 
              [src]="profile.profilePictureUrl" 
              alt="Profile Picture"
              class="profile-picture"
            >
          } @else {
            <div class="default-profile-icon">
              <i class="fas fa-user"></i>
            </div>
          }
          <div class="profile-picture-actions">
            <input 
              type="file" 
              #fileInput
              (change)="onFileSelected($event)"
              accept="image/jpeg,image/png,image/webp"
              style="display: none"
            >
            <button 
              class="upload-button" 
              (click)="fileInput.click()"
              [disabled]="isUploadingPicture"
            >
              @if (isUploadingPicture) {
                <span class="spinner"></span>
                Uploading...
              } @else {
                Upload New Picture
              }
            </button>
            @if (profile.profilePictureUrl) {
              <button 
                class="delete-button" 
                (click)="deleteProfilePicture()"
                [disabled]="isUploadingPicture"
              >
                @if (isUploadingPicture) {
                  <span class="spinner"></span>
                  Deleting...
                } @else {
                  Delete Picture
                }
              </button>
            }
          </div>
        </div>
      </div>

      <!-- Image Editor Modal -->
      @if (showImageEditor) {
        <div class="image-editor-modal">
          <div class="image-editor-container">
            <h3>Edit Profile Picture</h3>
            <div class="image-preview-container">
              <canvas 
                #canvas
                class="preview-canvas"
                (mousedown)="onMouseDown($event)"
                (mousemove)="onMouseMove($event)"
                (mouseup)="onMouseUp()"
                (mouseleave)="onMouseUp()"
              ></canvas>
              <img #previewImage style="display: none">
            </div>
            <div class="editor-controls">
              <div class="scale-control">
                <label>Scale: {{ scale.toFixed(2) }}</label>
                <input 
                  type="range" 
                  [min]="minScale" 
                  [max]="maxScale" 
                  step="0.01" 
                  [(ngModel)]="scale"
                  (input)="onScaleChange()"
                >
              </div>
              <div class="rotate-control">
                <label>Rotation</label>
                <div class="rotate-buttons">
                  <button (click)="onRotateChange(-90)">↺</button>
                  <button (click)="onRotateChange(90)">↻</button>
                </div>
              </div>
              <div class="editor-buttons">
                <button class="cancel-button" (click)="cancelEdit()">Cancel</button>
                <button 
                  class="save-button" 
                  (click)="uploadProfilePicture()"
                  [disabled]="isUploadingPicture"
                >
                  @if (isUploadingPicture) {
                    <span class="spinner"></span>
                    Uploading...
                  } @else {
                    Save Changes
                  }
                </button>
              </div>
            </div>
          </div>
        </div>
      }

      <form (ngSubmit)="onSubmit()" #profileForm="ngForm">
        <div class="profile-field">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="profile.name"
            required
          >
        </div>

        <div class="profile-field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="profile.email"
            required
          >
        </div>

        <div class="profile-field">
          <label for="phoneNumber">Phone Number</label>
          <input
            type="tel"
            id="phoneNumber"
            name="phoneNumber"
            [(ngModel)]="profile.phoneNumber"
          >
        </div>

        <div class="form-actions">
          <button type="submit" [disabled]="!profileForm.form.valid || isSubmitting">
            @if (isSubmitting) {
              <span class="spinner"></span>
              Saving...
            } @else {
              Save Changes
            }
          </button>
        </div>
      </form>

      <div class="message" *ngIf="message" [class.error]="isError">
        {{ message }}
      </div>
    </div>
  </div>
  <div class="loading" *ngIf="!profile">
    <div class="spinner"></div>
    <p>Loading profile information...</p>
  </div>
</div>
