<div class="container">
  <div class="table-container">
    <div class="table-header">
      <div class="role-filter" *ngIf="isAdmin">
        <span>Role Filter:</span>
        <select [(ngModel)]="selectedRole" (change)="filterUsers()">
          <option [ngValue]="''">All</option>
          <option [ngValue]="Role.CLIENT">Clients</option>
          <option [ngValue]="Role.AGENT">Agents</option>
        </select>
      </div>
    </div>
    <table mat-table [dataSource]="filteredUsers">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let user">{{user.id}}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">{{user.name}}</td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{user.email}}</td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let user">{{user.phoneNumber}}</td>
      </ng-container>

      <!-- Role Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let user">
          <span class="status-badge" [ngClass]="user.role.toLowerCase()">
            {{user.role}}
          </span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <button class="action-button view" (click)="onView(user)" aria-label="View user details">
            <i class="fas fa-eye"></i>
          </button>
          <button *ngIf="isAdmin" class="action-button edit" (click)="onEdit(user)" aria-label="Edit user">
            <i class="fas fa-edit"></i>
          </button>
          <button *ngIf="isAdmin" class="action-button delete" (click)="onDelete(user)" aria-label="Delete user">
            <i class="fas fa-trash-alt"></i>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Loading State -->
    <div class="loading-overlay" *ngIf="isLoading">
      <mat-spinner></mat-spinner>
    </div>

    <!-- No Data State -->
    <div class="no-data" *ngIf="!isLoading && filteredUsers.length === 0">
      <p>No users found</p>
    </div>
  </div>
</div>
