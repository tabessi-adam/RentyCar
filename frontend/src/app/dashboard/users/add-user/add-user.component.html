<div class="add-user-dialog">
  <div class="dialog-header">
    <h2>Add New User</h2>
    <button class="close-button" (click)="onCancel()" aria-label="Close dialog">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <form (ngSubmit)="onSubmit()" #userForm="ngForm">
    <mat-dialog-content>
      <div class="form-grid">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput [(ngModel)]="user.name" name="name" required>
          <mat-error *ngIf="!user.name">
            Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="user.email" name="email" type="email" required (blur)="checkEmailExists(user.email)">
          <mat-error *ngIf="!user.email">
            Email is required
          </mat-error>
          <mat-error *ngIf="user.email && !isValidEmail(user.email)">
            Please enter a valid email address
          </mat-error>
          <mat-error *ngIf="emailExists">
            This email is already registered
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Phone Number</mat-label>
          <input matInput [(ngModel)]="user.phoneNumber" name="phoneNumber">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Role</mat-label>
          <mat-select [(ngModel)]="user.role" name="role" required>
            <mat-option *ngFor="let role of roles" [value]="role">
              {{ role }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="!user.role">
            Role is required
          </mat-error>
        </mat-form-field>

        <mat-form-field *ngIf="user.role === Role.AGENT">
          <mat-label>Office</mat-label>
          <mat-select [(ngModel)]="user.officeId" name="officeId" required>
            <mat-option *ngFor="let office of offices" [value]="office.id">
              {{ office.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="user.role === Role.AGENT && !user.officeId">
            Office is required for agents
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Password</mat-label>
          <input matInput [(ngModel)]="user.password" name="password" type="password" required>
          <mat-error *ngIf="!user.password">
            Password is required
          </mat-error>
          <mat-error *ngIf="user.password && user.password.length < 6">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!isFormValid() || isLoading || emailExists">
        <span *ngIf="!isLoading">Create User</span>
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      </button>
    </mat-dialog-actions>
  </form>
</div>
