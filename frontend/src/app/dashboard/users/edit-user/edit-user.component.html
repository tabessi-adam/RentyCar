<div class="edit-user-dialog">
  <div class="dialog-header">
    <h2>Edit User</h2>
    <button class="close-button" (click)="onCancel()" aria-label="Close dialog">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <form (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <div class="form-grid">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput [(ngModel)]="user.name" name="name" required>
          <mat-error *ngIf="!user.name">
            Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="user.email" name="email" type="email" required>
          <mat-error *ngIf="!user.email">
            Email is required
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Phone Number</mat-label>
          <input matInput [(ngModel)]="user.phoneNumber" name="phoneNumber">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Role</mat-label>
          <mat-select [(ngModel)]="user.role" name="role" required>
            <mat-option *ngFor="let role of roles" [value]="role">
              {{ role }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="!user.role">
            Role is required
          </mat-error>
        </mat-form-field>

        <mat-form-field *ngIf="user.role === Role.AGENT">
          <mat-label>Office</mat-label>
          <mat-select [(ngModel)]="officeId" name="officeId" required>
            <mat-option *ngFor="let office of offices" [value]="office.id">
              {{ office.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="user.role === Role.AGENT && !officeId">
            Office is required for agents
          </mat-error>
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!user.name || !user.email || !user.role || isLoading">
        <span *ngIf="!isLoading">Update User</span>
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      </button>
    </mat-dialog-actions>
  </form>
</div>
