<h2 mat-dialog-title>Client Details</h2>
<mat-dialog-content>
  <div *ngIf="client" class="client-details">
    <div class="detail-row">
      <span class="label">ID:</span>
      <span class="value">{{client.id}}</span>
    </div>

    <div class="detail-row">
      <span class="label">Name:</span>
      <span class="value">{{client.name}}</span>
    </div>

    <div class="detail-row">
      <span class="label">Email:</span>
      <span class="value">{{client.email}}</span>
    </div>

    <div class="detail-row">
      <span class="label">Phone Number:</span>
      <span class="value">{{client.phoneNumber || 'N/A'}}</span>
    </div>

    <div class="detail-row">
      <span class="label">Created At:</span>
      <span class="value">{{formatDate(client.createdAt)}}</span>
    </div>

    <div class="detail-row">
      <span class="label">Last Updated:</span>
      <span class="value">{{formatDate(client.updatedAt)}}</span>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
