<div class="edit-client-dialog">
  <div class="dialog-header">
    <h2>Edit Client</h2>
    <button class="close-button" (click)="onCancel()" aria-label="Close dialog">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <div class="form-grid">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" required>
          <mat-error *ngIf="editForm.get('name')?.hasError('required')">
            Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" required>
          <mat-error *ngIf="editForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="editForm.get('email')?.hasError('email')">
            Please enter a valid email address
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Phone Number</mat-label>
          <input matInput formControlName="phoneNumber">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Role</mat-label>
          <mat-select formControlName="role" required>
            <mat-option *ngFor="let role of roleOptions" [value]="role">
              {{role | titlecase}}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="editForm.get('role')?.hasError('required')">
            Role is required
          </mat-error>
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!editForm.valid || isLoading">
        <span *ngIf="!isLoading">Update Client</span>
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      </button>
    </mat-dialog-actions>
  </form>
</div>
