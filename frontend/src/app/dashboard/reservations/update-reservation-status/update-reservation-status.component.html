<div class="update-reservation-dialog">
  <div class="dialog-header">
    <h2>Update Reservation Status</h2>
    <button class="close-button" (click)="onCancel()" aria-label="Close dialog">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <form (ngSubmit)="onSubmit()" #statusForm="ngForm">
    <mat-dialog-content>
      <div class="form-grid">
        <div class="reservation-info">
          <p><strong>Reservation ID:</strong> {{reservation.id}}</p>
          <p><strong>Client:</strong> {{reservation.client?.name || 'Unknown'}}</p>
          <p><strong>Vehicle:</strong> {{reservation.vehicle?.brand}} {{reservation.vehicle?.model}}</p>
        </div>

        <mat-form-field>
          <mat-label>New Status</mat-label>
          <mat-select [(ngModel)]="newStatus" name="status" required>
            <mat-option *ngFor="let status of statusOptions" [value]="status">
              {{status}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!statusForm.valid || isLoading">
        <span *ngIf="!isLoading">Update Status</span>
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      </button>
    </mat-dialog-actions>
  </form>
</div>
