<div class="container">
    <div class="table-container">
      <table mat-table [dataSource]="vehicles">
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let vehicle">{{vehicle.id}}</td>
        </ng-container>
        <!-- Status Column -->
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let vehicle">
              <span class="status-badge" [ngClass]="vehicle.status.toLowerCase()">
                {{vehicle.status}}
              </span>
            </td>
          </ng-container>
  
        <!-- Brand Column -->
        <ng-container matColumnDef="brand">
          <th mat-header-cell *matHeaderCellDef>Brand</th>
          <td mat-cell *matCellDef="let vehicle">{{vehicle.brand}}</td>
        </ng-container>
  
        <!-- Model Column -->
        <ng-container matColumnDef="model">
          <th mat-header-cell *matHeaderCellDef>Model</th>
          <td mat-cell *matCellDef="let vehicle">{{vehicle.model}}</td>
        </ng-container>
  
        <!-- Year Column -->
        <ng-container matColumnDef="year">
          <th mat-header-cell *matHeaderCellDef>Year</th>
          <td mat-cell *matCellDef="let vehicle">{{vehicle.year}}</td>
        </ng-container>
  
        
  
        <!-- Price per Day Column -->
        <ng-container matColumnDef="pricePerDay">
          <th mat-header-cell *matHeaderCellDef>Price/Day</th>
          <td mat-cell *matCellDef="let vehicle">{{vehicle.pricePerDay | currency}}</td>
        </ng-container>
  
        <!-- Office Column -->
        <ng-container matColumnDef="office">
          <th mat-header-cell *matHeaderCellDef>Office</th>
          <td mat-cell *matCellDef="let vehicle">{{getOfficeName(vehicle.officeId)}}</td>
        </ng-container>
  
        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let vehicle">
            <button class="action-button view" (click)="onView(vehicle)" aria-label="View vehicle details">
              <i class="fas fa-eye"></i>
            </button>
            <button class="action-button edit" (click)="onEdit(vehicle)" aria-label="Edit vehicle">
              <i class="fas fa-edit"></i>
            </button>
            <button class="action-button delete" (click)="onDelete(vehicle)" aria-label="Delete vehicle">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
  
      <!-- Loading State -->
      <div class="loading-overlay" *ngIf="isLoading">
        <mat-spinner></mat-spinner>
      </div>
  
      <!-- No Data State -->
      <div class="no-data" *ngIf="!isLoading && vehicles.length === 0">
        <p>No vehicles found</p>
      </div>
    </div>
  </div>
