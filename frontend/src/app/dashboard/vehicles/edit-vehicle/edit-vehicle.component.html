<div class="edit-vehicle-dialog">
  <div class="dialog-header">
    <h2>Edit Vehicle</h2>
    <button class="close-button" (click)="onCancel()" aria-label="Close dialog">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <form (ngSubmit)="onSubmit()" #vehicleForm="ngForm">
    <mat-dialog-content>
      <div class="form-grid">
        <!-- Basic Information -->
        <mat-form-field>
          <mat-label>Brand</mat-label>
          <input matInput [(ngModel)]="vehicle.brand" name="brand" required>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Model</mat-label>
          <input matInput [(ngModel)]="vehicle.model" name="model" required>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Year</mat-label>
          <mat-select [(ngModel)]="vehicle.year" name="year" required>
            <mat-option *ngFor="let year of years" [value]="year">
              {{ year }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Color</mat-label>
          <mat-select [(ngModel)]="vehicle.color" name="color" required>
            <mat-option *ngFor="let color of colorOptions" [value]="color">
              {{ color }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Kilometers Driven</mat-label>
          <input matInput type="number" [(ngModel)]="vehicle.kilometersDriven" name="kilometersDriven" required min="0">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Status</mat-label>
          <mat-select [(ngModel)]="vehicle.status" name="status" required>
            <mat-option *ngFor="let status of statusOptions" [value]="status">
              {{status}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Fuel Type</mat-label>
          <mat-select [(ngModel)]="vehicle.fuelType" name="fuelType" required>
            <mat-option *ngFor="let type of fuelTypeOptions" [value]="type">
              {{type}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Transmission</mat-label>
          <mat-select [(ngModel)]="vehicle.transmission" name="transmission" required>
            <mat-option *ngFor="let type of transmissionOptions" [value]="type">
              {{type}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Price per Day</mat-label>
          <input matInput type="number" [(ngModel)]="vehicle.pricePerDay" name="pricePerDay" required min="0" step="0.01">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Office</mat-label>
          <mat-select [(ngModel)]="vehicle.officeId" name="officeId" required>
            <mat-option *ngFor="let office of offices" [value]="office.id">
              {{office.name}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Features -->
        <div class="features-grid">
          <mat-checkbox [(ngModel)]="vehicle.hasGPS" name="hasGPS">GPS</mat-checkbox>
          <mat-checkbox [(ngModel)]="vehicle.hasBluetooth" name="hasBluetooth">Bluetooth</mat-checkbox>
          <mat-checkbox [(ngModel)]="vehicle.hasAirConditioning" name="hasAirConditioning">Air Conditioning</mat-checkbox>
          <mat-checkbox [(ngModel)]="vehicle.hasUSBCable" name="hasUSBCable">USB Cable</mat-checkbox>
        </div>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!vehicleForm.valid || isLoading">
        <span *ngIf="!isLoading">Update Vehicle</span>
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      </button>
    </mat-dialog-actions>
  </form>
</div>
